; Refarter settings, read at startup and updated when a setting changes in the app.
; This file lives in %LOCALAPPDATA%\Refarter. Refarter creates it from this template
; (built into Refarter.exe) on first launch; delete it to return to the defaults.
; A missing or invalid value uses the default shown here.

[shortcuts]
; Global save-replay shortcut: modifiers ctrl, alt, shift, win, then one key,
; e.g. "ctrl + shift + f10", "alt + f9", "ctrl + alt + r".
save_replay = ctrl + shift + f10
; Global screenshot shortcut, the same form: saves the next picture of a running replay
; as a PNG in the clip folder's "screenshots" folder.
screenshot = ctrl + shift + f11

[recording]
; Whole monitor chosen last time (e.g. \\.\DISPLAY1), selected again at startup.
; Empty: choose a source each time.
source_monitor =
; 5-3600
replay_seconds = 180
; on: games on your auto-capture list (auto_capture.dat beside this file, edited
; from the recording page or the tray) start replay when they come to the front.
; Never applies while a whole monitor is the chosen source.
auto_capture = on
; on: the first time a fullscreen app opens, a card above the tray asks whether
; to add it. It never takes focus; "not this one" is remembered.
auto_capture_prompt = on

[video]
; native, 2160p, 1440p, 1080p or 720p (never upscales)
resolution = native
; 30 or 60
fps = 60
; small, balanced, high or custom
quality = balanced
; Constant bitrate for quality = custom, 2-250
bitrate_mbps = 50
; h264, hevc or av1 (hevc/av1 fall back to h264 if the GPU cannot record them)
codec = h264

[audio]
; off, default (follows the Windows default device) or a device chosen on the
; Recording page, stored as its Windows endpoint ID; the name is for reading only.
; A chosen device that is unplugged records silence until it returns; Refarter
; never switches to another device by itself. desktop_device records everything
; played on that output, not a single app.
desktop_device = default
desktop_device_name =
microphone_device = off
microphone_device_name =
; Saved volume in percent, 0-200 (0 keeps a silent track, above 100 boosts)
desktop_volume = 100
mic_volume = 100
; on: Discord is not recorded at all (the Recording page shows this switch as
; "record discord", inverted). off: Discord gets its own track (and is in
; the mix) where Windows can split it out (desktop_device = default, or Discord on
; another output than the chosen one; Windows 10 2004 or newer)
hide_discord = off
; Volume of the save chime and the failed-save sound (Settings, sound), 0-100 (0 silences both); only Refarter's own sounds
chime_volume = 100
noise_suppression = off
noise_gate = off
; Gate levels -96 to 0 dB with close at or below open; times 0-10000 ms
gate_open_db = -26
gate_close_db = -32
gate_attack_ms = 25
gate_hold_ms = 200
gate_release_ms = 150

[storage]
; Empty: Videos\Refarter in your profile
clip_folder =
; Largest size of the clip folder in whole gb, 0-99999 (larger numbers count as 99999); 0 or empty is no limit. The strip under the
; library shows how much is used. Counts every clip in the folder, compressed copies included.
max_storage_gb = 0
; What a save does when it would pass the limit: warn (save anyway, say so), refuse (do not save;
; the replay is kept) or bin (move the oldest clips that are not favourites to the Recycle Bin
; first; only on a local drive with a Recycle Bin, otherwise it warns). Empty: not chosen yet, Refarter asks once
; (when its own window is in front) and acts as warn meanwhile.
when_full =

[library]
; Library tile size: comfortable (large tiles) or compact (small tiles)
density = comfortable
; on: the library shows a folder per game (or capture source) in every tab; only a view, no files move
folders = off
; on: moving clips to the recycle bin asks first. The question's "don't ask again" box (ticked, then yes)
; and the Settings switch turn this off; clips still go to the recycle bin, never deleted for good
ask_before_binning = on
; Built-in player volume, 0-100
player_volume = 100
; on: the trim bar's "compress & copy" box starts ticked (after a trim is saved, a 20mb copy is made
; and copied to the clipboard as a file)
compress_copy_after_trim = off

[window]
; on: closing the window keeps Refarter in the tray (replay and shortcut keep working)
close_to_tray = off
; Opt-in at sign-in. Change through Settings to update Windows.
start_with_windows = off
; on: sign-in starts in the tray; off: opens the window. Only applies to Windows startup.
start_minimised = on
; expanded or collapsed (icons only)
sidebar = expanded

[diagnostics]
; Opt-in local session events in LocalAppData\Refarter\logs (three files, 2 MiB each).
; No media, window titles or personal paths. Existing logs remain when switched off.
logging = off

[updates]
; ask: Refarter asks once (when its own window is in front) whether it may check GitHub for a newer version.
; on: once a day at most, at start-up, Refarter asks GitHub for the latest release. Only the request itself is sent
; (your IP address and "Refarter/<version>" as the user agent); nothing is downloaded. off: never, except the
; "check for updates" button in Settings.
check = ask
; Unix seconds of the last check that got an answer (written by Refarter; 0 or empty: never).
last_check = 0
; Last known newer release (written by Refarter), so its notice survives a restart without another request.
available_tag =
available_url =
